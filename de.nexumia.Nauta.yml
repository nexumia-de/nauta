id: de.nexumia.Nauta
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: nauta
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Music.
  - --socket=pulseaudio
  # The Navidrome server, local and remote.
  - --share=network
  # The Wi-Fi name, to use the local address at home (docs/connection.md).
  - --system-talk-name=org.freedesktop.NetworkManager
  # Media controls on the lock screen and in Phosh (MPRIS,
  # docs/playback.md); the nightly app uses its own name.
  - --own-name=org.mpris.MediaPlayer2.Nauta
  - --own-name=org.mpris.MediaPlayer2.Nauta.Devel
  # The notification shown while playing in the background: swiping it
  # away quits, which the notification portal does not report
  # (docs/playback.md).
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'
# Apart from the modules below, everything Nauta needs is in the GNOME
# runtime (GTK, libadwaita, libsoup 3, libsecret, GStreamer). Inventory:
# docs/dependencies.md.
modules:
  # Shared connection and playback code (phosh-toolkit
  # docs/shared-connection.md), next to Nauta's package in site-packages.
  - name: phosh-toolkit
    buildsystem: simple
    build-commands:
      - install -Dm644 -t "$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib", vars={"base":"/app"}))')/phosh_toolkit" lib/phosh_toolkit/*.py
      - install -Dm644 -t /app/share/licenses/$FLATPAK_ID/phosh-toolkit LICENSE
    sources:
      - type: git
        url: https://github.com/nexumia-de/phosh-toolkit.git
        tag: v0.3.0
        commit: c29a2a106dd2328c24d0201f1cc31f7da7c695f2
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
  # Japanese, Chinese and Korean text (artists, albums, titles). The
  # GNOME runtime has no CJK font and the phone may have none to share
  # (docs/dependencies.md#fonts); fontconfig in the runtime reads
  # /app/share/fonts.
  - name: noto-cjk
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/fonts/noto-cjk NotoSansCJK-VF.otf.ttc
      - install -Dm644 -t /app/share/licenses/$FLATPAK_ID/noto-cjk LICENSE
    sources:
      - type: file
        url: https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/Variable/OTC/NotoSansCJK-VF.otf.ttc
        sha256: d3d8256cdec8dbcb3552284bc6b20c734dd60c2ee9df83b5758e34807c4bac32
        x-checker-data:
          type: json
          url: https://api.github.com/repos/notofonts/noto-cjk/releases
          version-query: '[.[] | select(.tag_name | startswith("Sans"))] | first | .tag_name | sub("^Sans"; "")'
          url-query: '"https://raw.githubusercontent.com/notofonts/noto-cjk/Sans" + $version + "/Sans/Variable/OTC/NotoSansCJK-VF.otf.ttc"'
      # Follows the font above.
      - type: file
        url: https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/LICENSE
        sha256: 6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2
  - name: nauta
    buildsystem: meson
    sources:
      - type: dir
        path: .
        skip:
          - build-dir
          - repo
          - tests
          - .phosh-toolkit
