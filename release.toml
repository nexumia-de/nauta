# Release automation: changelog fragments, release pull request and
# screenshots (phosh-toolkit docs/releases.md, docs/release-channels.md).
metainfo = "data/de.nexumia.Nauta.metainfo.xml"
version-files = ["meson.build", "nauta/__init__.py"]

# Taken by CI from the built Flatpak at 360×720 and 1000×700, light and
# dark, signed in to the recorded demo library in tests/data/demo, which
# the app serves itself (NAUTA_DEMO, docs/release-channels.md). Covers
# and sound are made by the demo server. No network is used.
[screenshots]
env = { NAUTA_DEMO = "{root}/tests/data/demo", TZ = "Europe/Berlin" }
expose = ["{root}/tests/data/demo"]
delay = 4

[[screenshots.shot]]
name = "albums"
caption = "The newest albums of the library"

[[screenshots.shot]]
name = "album"
caption = "An album"
actions = ["app.show-album('al-195308cfb6d233b94d9b')"]

[[screenshots.shot]]
name = "now-playing"
caption = "Now playing, with the queue"
actions = ["app.play-album('al-195308cfb6d233b94d9b')"]

[[screenshots.shot]]
name = "artist"
caption = "An artist with popular songs, artist radio and similar artists"
actions = ["app.show-artist('ar-0cc9bd8a19dfe4c22d8f')"]

[[screenshots.shot]]
name = "lyrics"
caption = "Lyrics that follow the song"
actions = ["app.play-album('al-195308cfb6d233b94d9b')", "app.show-lyrics"]

[[screenshots.shot]]
name = "find-music"
caption = "Finding new music with your own MeTube server"
actions = ["app.find-music-for('harbour lights')"]

[[screenshots.shot]]
name = "find-album"
caption = "Downloading a whole album, or only some of its songs"
actions = ["app.find-music-for('https://music.youtube.com/browse/MPREb_demoHarbour01')"]
